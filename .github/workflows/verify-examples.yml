name: Verify Example Bundles

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'apps/verify/**'
      - '.github/workflows/verify-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'apps/verify/**'
      - '.github/workflows/verify-examples.yml'

jobs:
  verify-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        example:
          - pocketos-reconstruction
          - datatalks-reconstruction

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          # 1.22 emits macOS binaries dyld will not load; see .github/workflows/ci.yml.
          go-version: '1.24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Go capture-shim
        run: |
          cd apps/capture-shim
          go build -o depose-shim .

      - name: Build depose-verify
        run: |
          cd apps/verify
          go build -o build/depose-verify .

      - name: Produce signed bundle for ${{ matrix.example }}
        # Runs in `signed` mode by default (no --skip-timestamp).
        # Hits FreeTSA over the network, GH Actions runners have it.
        run: |
          cd examples/${{ matrix.example }}
          bash produce.sh

      - name: Run depose-verify on the bundle (happy path)
        run: |
          EXAMPLE="${{ matrix.example }}"
          OUTPUT_DIR="examples/${EXAMPLE}/depose-output"
          # Bundle name is incident-<id> for signed mode; the find
          # matches dev-unsigned too (incident-unsigned-<id>) since
          # both start with "incident-".
          DEPO_DIR=$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -name "incident-*" -type d | head -1)
          if [ -z "$DEPO_DIR" ]; then
            echo "ERROR: No bundle directory found"; exit 1
          fi
          echo "Verifying: $DEPO_DIR"
          ./apps/verify/build/depose-verify verify "$DEPO_DIR"

      - name: Negative tests, three semantic tampers must each FAIL
        # The previous test flipped one random byte at offset 2 of
        # events.jsonl, which lands inside a JSON object header and
        # failed only because json.Unmarshal errored, passing
        # incorrectly when a semantically meaningful mutation left
        # JSON intact. We exercise the three attacks the producer/
        # verifier contract is supposed to defend against:
        #
        #   (a) payload tamper        rewrite a payload string,
        #                              leave payloadHash/chainHash intact.
        #   (b) payloadHash tamper    flip a hex char inside payloadHash.
        #   (c) chainHash tamper      flip a hex char inside chainHash.
        #
        # All three must produce a non-zero exit from depose-verify.
        run: |
          set -e
          EXAMPLE="${{ matrix.example }}"
          OUTPUT_DIR="examples/${EXAMPLE}/depose-output"
          DEPO_DIR=$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -name "incident-*" -type d | head -1)
          if [ -z "$DEPO_DIR" ]; then echo "no bundle"; exit 1; fi

          assert_fail() {
            local label="$1" workdir="$2"
            set +e
            ./apps/verify/build/depose-verify verify "$workdir" > /dev/null
            local status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "ERROR: $label tamper was accepted (exit 0)"
              ./apps/verify/build/depose-verify verify "$workdir"
              exit 1
            fi
            echo "OK, $label tamper rejected (exit $status)"
          }

          # (a) Payload tamper: rewrite a prompt string in events.jsonl
          # without touching payloadHash. Tool inputs are committed
          # fields, so the command text lives in commitments.json; that
          # is tampered in (d) below.
          A=$(mktemp -d); cp -r "$DEPO_DIR"/. "$A"
          python3 -c '
          import sys, json
          p = sys.argv[1]
          lines = open(p).read().split("\n")
          for i, line in enumerate(lines):
              if "\"type\":\"prompt\"" in line:
                  obj = json.loads(line)
                  obj["payload"]["text"] = "REWRITTEN AFTER SEALING"
                  lines[i] = json.dumps(obj, separators=(",", ":"))
                  break
          else:
              raise SystemExit("no prompt event in fixture")
          open(p, "w").write("\n".join(lines))
          ' "$A/events.jsonl"
          assert_fail "payload-string" "$A"

          # (d) Committed-field tamper: rewrite the destructive command
          # inside its commitments.json opening. The files map catches the
          # byte change and the commitments check catches the opening no
          # longer matching the sealed hash.
          D=$(mktemp -d); cp -r "$DEPO_DIR"/. "$D"
          sed -i 's|rm -rf /data/training|rm -rf /tmp/nothing |g' "$D/commitments.json" || true
          sed -i 's|terraform destroy -auto-approve|terraform plan -auto-approve  |g' "$D/commitments.json" || true
          assert_fail "committed-field" "$D"

          # (b) payloadHash tamper: flip a hex character inside the
          # first payloadHash literal. Verifier should fail on
          # chain-replay (and/or payload-hash), never PASS.
          B=$(mktemp -d); cp -r "$DEPO_DIR"/. "$B"
          python3 -c '
          import sys, re
          p = sys.argv[1]
          data = open(p).read()
          # Flip one hex char inside the first occurrence of payloadHash.
          def flip(m):
              v = m.group(1)
              ch = v[0]
              swap = "0" if ch != "0" else "1"
              return "\"payloadHash\":\"" + swap + v[1:] + "\""
          data, n = re.subn(r"\"payloadHash\":\"([0-9a-f]{64})\"", flip, data, count=1)
          assert n == 1, "no payloadHash field found"
          open(p, "w").write(data)
          ' "$B/events.jsonl"
          assert_fail "payloadHash-hex" "$B"

          # (c) chainHash tamper: flip one hex char inside the first
          # chainHash literal. Must fail at chain-replay.
          C=$(mktemp -d); cp -r "$DEPO_DIR"/. "$C"
          python3 -c '
          import sys, re
          p = sys.argv[1]
          data = open(p).read()
          def flip(m):
              v = m.group(1)
              ch = v[0]
              swap = "0" if ch != "0" else "1"
              return "\"chainHash\":\"" + swap + v[1:] + "\""
          data, n = re.subn(r"\"chainHash\":\"([0-9a-f]{64})\"", flip, data, count=1)
          assert n == 1, "no chainHash field found"
          open(p, "w").write(data)
          ' "$C/events.jsonl"
          assert_fail "chainHash-hex" "$C"

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-bundle-node${{ matrix.node-version }}
          path: examples/${{ matrix.example }}/depose-output/
          retention-days: 7

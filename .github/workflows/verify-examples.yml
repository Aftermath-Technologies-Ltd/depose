name: Verify Example Bundles

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'apps/verify/**'
      - '.github/workflows/verify-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'apps/verify/**'
      - '.github/workflows/verify-examples.yml'

jobs:
  verify-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        example:
          - pocketos-reconstruction
          - datatalks-reconstruction

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Go capture-shim
        run: |
          cd apps/capture-shim
          go build -o depose-shim .

      - name: Build depose-verify
        run: |
          cd apps/verify
          go build -o build/depose-verify .

      - name: Produce signed bundle for ${{ matrix.example }}
        # Runs in `signed` mode by default (no --skip-timestamp).
        # Hits FreeTSA over the network — GH Actions runners have it.
        run: |
          cd examples/${{ matrix.example }}
          bash produce.sh

      - name: Run depose-verify on the bundle (happy path)
        run: |
          EXAMPLE="${{ matrix.example }}"
          OUTPUT_DIR="examples/${EXAMPLE}/depose-output"
          # Bundle name is incident-<id> for signed mode; the find
          # matches dev-unsigned too (incident-unsigned-<id>) since
          # both start with "incident-".
          DEPO_DIR=$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -name "incident-*" -type d | head -1)
          if [ -z "$DEPO_DIR" ]; then
            echo "ERROR: No bundle directory found"; exit 1
          fi
          echo "Verifying: $DEPO_DIR"
          ./apps/verify/build/depose-verify verify "$DEPO_DIR"

      - name: Negative test — one-byte tamper of events.jsonl must FAIL
        # Mutate a single byte and re-verify; expect a non-zero exit.
        # This is what makes the README's "rebuilds and validates
        # end-to-end" claim true.
        run: |
          EXAMPLE="${{ matrix.example }}"
          OUTPUT_DIR="examples/${EXAMPLE}/depose-output"
          DEPO_DIR=$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -name "incident-*" -type d | head -1)
          # Flip a byte near the start of events.jsonl
          dd if=/dev/urandom of="$DEPO_DIR/events.jsonl" bs=1 count=1 seek=2 conv=notrunc status=none
          set +e
          ./apps/verify/build/depose-verify verify "$DEPO_DIR"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: verifier accepted tampered bundle (exit 0 from tampered events.jsonl)"
            exit 1
          fi
          echo "OK — verifier rejected tampered bundle (exit $STATUS)"

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-bundle-node${{ matrix.node-version }}
          path: examples/${{ matrix.example }}/depose-output/
          retention-days: 7

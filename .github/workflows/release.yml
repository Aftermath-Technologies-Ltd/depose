name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # OIDC token issuance for cosign keyless signing.
  id-token: write
  # Required for actions/upload-release-asset and gh release.
  contents: write
  # Required by the SLSA generator.
  actions: read

jobs:
  build:
    name: Cross-compile the release binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 1.22 emits macOS binaries dyld will not load; see .github/workflows/ci.yml.
          go-version: '1.24'

      - name: Cross-compile depose-verify (darwin/linux × arm64/amd64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd apps/verify
          make all VERSION="${VERSION#v}"
          ls -la build/

      - name: Cross-compile depose-collect-execve (linux × arm64/amd64)
        # Linux only. The collector compiles on darwin but refuses to run
        # there, and a binary whose only behaviour is to fail is not
        # something to publish (docs/decisions.md D18).
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd apps/collect-execve
          make all VERSION="${VERSION#v}"
          cp build/depose-collect-execve-* ../verify/build/
          ls -la ../verify/build/

      - name: Generate SHA256SUMS
        id: hashes
        # One SHA256SUMS over both binaries, so the single cosign
        # signature below covers everything the release ships.
        run: |
          cd apps/verify/build
          sha256sum depose-verify-* depose-collect-execve-* > SHA256SUMS
          cat SHA256SUMS
          # base64-encoded hashes for the SLSA provenance generator.
          # The SLSA action expects the SHA256SUMS file as input.
          echo "hashes=$(sha256sum depose-verify-* depose-collect-execve-* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign, keyless (OIDC → Fulcio → Rekor)
        # Signs SHA256SUMS, producing SHA256SUMS.sig and
        # SHA256SUMS.pem (the short-lived Fulcio cert). Recipients
        # verify with `cosign verify-blob --certificate ... --signature ...
        # --certificate-identity-regexp ... --certificate-oidc-issuer ...`.
        run: |
          cd apps/verify/build
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: depose-verify-release
          path: apps/verify/build/
          retention-days: 5

  provenance:
    name: SLSA L3 provenance
    needs: build
    permissions:
      id-token: write
      contents: write
      actions: read
    # The SLSA generator publishes a signed in-toto attestation that
    # binds the SHA256SUMS contents to the GitHub Actions workflow
    # run that produced them.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish:
    name: Publish GitHub Release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: depose-verify-release
          path: release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          cat > NOTES.md <<'NOTES'
          DEPOSE release binaries.

          `depose-verify` (darwin and linux, arm64 and amd64) checks a bundle
          off-host. It is the only binary a recipient needs.

          `depose-collect-execve` (linux only) is the optional eBPF execve
          collector, for producers. It needs CAP_BPF. macOS has no supported
          equivalent and so ships no binary; see docs/capture-coverage.md.

          Verify the download:

              cosign verify-blob \
                --certificate SHA256SUMS.pem \
                --signature SHA256SUMS.sig \
                --certificate-identity-regexp '^https://github.com/Aftermath-Technologies-Ltd/depose/' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                SHA256SUMS
              sha256sum -c SHA256SUMS
          NOTES
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file NOTES.md \
            depose-verify-* depose-collect-execve-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem

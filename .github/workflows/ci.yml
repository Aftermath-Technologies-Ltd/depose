name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    # D6: package.json:engines.node = ">=20". We verify on both the
    # minimum supported version (20) and the current LTS (22) so a
    # regression in either fails the build, not just one.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build verifier (for e2e tests)
        run: |
          cd apps/verify
          make build-local

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Forbid stale verifier URLs outside constants.ts
        # C2 invariant: the verifier download URL has a single source
        # of truth in packages/bundle/src/constants.ts. Anywhere else
        # would silently bake a wrong path into verify.txt.
        run: |
          if grep -rn --include='*.ts' --include='*.md' --include='*.sh' \
              --exclude-dir=node_modules --exclude-dir=dist \
              --exclude='constants.ts' --exclude='update-plan.md' \
              'github.com/depose/depose' .; then
            echo "Stale 'github.com/depose/depose' URL found. Use VERIFIER_DOWNLOAD_URL from @depose/bundle."
            exit 1
          fi

      - name: Forbid Math.random in evidence paths
        # B3 invariant: signatures, chains, and event IDs must come
        # from a CSPRNG, never Math.random. Production source under
        # these paths must not call it. We match `Math.random(` to
        # avoid false positives in comments that name the API.
        run: |
          if grep -rn --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              'Math\.random(' \
              packages/chain/src \
              packages/bundle/src \
              packages/core/src/events; then
            echo "Math.random forbidden under packages/chain/src, packages/bundle/src, packages/core/src/events"
            exit 1
          fi

      - name: TypeScript tests
        run: pnpm test

      - name: Go verifier tests
        run: cd apps/verify && go test ./...

  verify-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build verifier
        run: |
          cd apps/verify
          go mod tidy
          go vet ./...
          go build -o build/depose-verify .

      - name: Go tests (incl. canonical JSON conformance vectors)
        run: |
          cd apps/verify
          go test ./...

      - name: Cross-compile verifier
        run: |
          cd apps/verify
          make all

      - name: Upload verifier binaries
        uses: actions/upload-artifact@v4
        with:
          name: depose-verify-binaries
          path: apps/verify/build/
          retention-days: 5

  # F-27: Round-trip determinism test.
  # Produces a bundle twice with a fixed ULID seed and pinned timestamps,
  # then diffs the outputs. Any nondeterminism (clock leaks, map iteration
  # order, etc.) will cause the diff to be non-empty and fail the build.
  determinism:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Determinism test
        run: bash scripts/determinism-test.sh